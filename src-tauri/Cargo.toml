[package]
name = "certaro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
description = "Certaro desktop application"

[lib]
name = "certaro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
certaro-application = { workspace = true }
certaro-infrastructure = { workspace = true }
certaro-domain = { workspace = true }
certaro-import-legacy = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-opener = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# Used by `tauri dev`; the CLI passes it through.
custom-protocol = ["tauri/custom-protocol"]
