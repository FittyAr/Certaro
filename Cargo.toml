[workspace]
resolver = "2"
members = [
    "crates/certaro-domain",
    "crates/certaro-application",
    "crates/certaro-infrastructure",
    "crates/certaro-migration",
    "crates/certaro-import-legacy",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license-file = "LICENSE"
authors = ["Certaro Project Owners (FittyAr)"]
repository = "https://github.com/FittyAr/Certaro"

[workspace.dependencies]
# Internal crates
certaro-domain = { path = "crates/certaro-domain" }
certaro-application = { path = "crates/certaro-application" }
certaro-infrastructure = { path = "crates/certaro-infrastructure" }
certaro-migration = { path = "crates/certaro-migration" }
certaro-import-legacy = { path = "crates/certaro-import-legacy" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
async-trait = "0.1"
futures = "0.3"

# Persistence
sea-orm = { version = "1", features = [
    "sqlx-sqlite",
    "sqlx-mysql",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
] }
sea-orm-migration = { version = "1", features = [
    "sqlx-sqlite",
    "sqlx-mysql",
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "mysql",
    "postgres",
    "runtime-tokio-rustls",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Core types
# Money and Decimal4 are hand-written i64 newtypes (docs/04); no decimal crate on purpose.
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"

# Errors
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Validation
validator = { version = "0.18", features = ["derive"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Reports
printpdf = "0.12"
rust_xlsxwriter = { version = "0.99", features = ["chrono"] }
docx-rs = "0.4"
csv = "1"

# Config
figment = { version = "0.10", features = ["json", "env"] }

# Auth & Crypto
argon2 = "0.5"
rand = "0.8"
sha2 = "0.11"
totp-rs = { version = "5.6", default-features = false, features = ["gen_secret"] }

# CLI (certaro-import-legacy only)
clap = { version = "4", features = ["derive"] }

# Tauri shell
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# Testing
tokio-test = "0.4"
mockall = "0.15"
rstest = "0.26"
proptest = "1"
wiremock = "0.6"
insta = { version = "1", features = ["json"] }
tempfile = "3"
pretty_assertions = "1"
# Reading back what the generators produced: a PDF is verified by its extracted text and an XLSX
# by the XML inside its zip (doc 17 §4.4). Comparing bytes would break on every library bump.
pdf-extract = "0.12"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
incremental = true
