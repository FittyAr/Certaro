name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build without publishing'
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF#refs/tags/}"
      - run: node scripts/sync-version.mjs --check

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   args: '' }
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, args: '' }
          - { os: macos-latest,   target: aarch64-apple-darwin,     args: '' }
          - { os: macos-latest,   target: x86_64-apple-darwin,      args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }
      - uses: Swatinem/rust-cache@v2
        with: { key: release-${{ matrix.target }} }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        env:
          VITE_PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_KEY }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'ElectroObra v__VERSION__'
          releaseBody: |
            See [CHANGELOG.md](https://github.com/nicoechaniz/ElectroObra-rust/blob/main/CHANGELOG.md) for details.

            ## Migration from legacy
            If you are upgrading from the C# version, use `eo-import-legacy` to migrate your data. See the README for instructions.
          releaseDraft: true
          args: --target ${{ matrix.target }} ${{ matrix.args }}
